name: Tortoise-Serializer

on:
  push:
    branches: ["master", "dev"]
  pull_request:
    branches: ["master", "dev"]

permissions:
  contents: read

jobs:
  build:
    environment: tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up uv
      uses: astral-sh/setup-uv@v7
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: uv sync

    - name: Check norm
      run: uv run ruff check tortoise_serializer

    - name: Test with pytest
      run: uv run pytest --cov tortoise_serializer --cov-report=xml

    - name: Upload coverage report
      env:
        CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
      run: bash <(curl -Ls https://coverage.codacy.com/get.sh) report -r coverage.xml
