[project]
name = "tortoise-serializer"
dynamic = ["version"]
description = "Pydantic serialization for tortoise-orm"
authors = [{name="Sebastien Nicolet", email="snicolet95@gmail.com"}]
license = "MIT"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "frozendict>=2.4.6",
    "tortoise-orm~=1.1.0",
    "pydantic>=2.12.2,<3.0.0",
    "structlog>=25.4.0,<26.0.0",
]

[dependency-groups]
dev = [
    "coverage>=7.11.0",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0,<2.0.0",
    "pytest-cov>=7.0.0,<8.0.0",
    "ruff>=0.14.1,<0.15.0",
    "ipython>=9.6.0,<10.0.0",
    "aiosqlite>=0.21.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "tortoise_serializer/__init__.py"

[tool.ruff]
target-version = "py312"
line-length = 79
indent-width = 4

[tool.pytest.ini_options]
asyncio_mode = "auto"
